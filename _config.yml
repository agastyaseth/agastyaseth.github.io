# --- Site --- #
url: "https://agastyaseth.tech"
baseurl: ""

title: Agastya Seth
tagline: "Staff AI Engineer · Agentic Systems, LLM Evals, AI Infrastructure"
description: "Agastya Seth is a Staff AI Engineer building agentic systems, LLM evals, and AI infrastructure."

# Square headshot shown in the homepage hero and used for social cards.
# Drop a photo at img/headshot.jpg and set this to "/img/headshot.jpg".
headshot: "/img/avatar-icon-email.png"

# --- Navigation --- #
navbar-links:
  About: "/aboutme/"
  Posts: "/posts/"
  Resume: "/resume.pdf"

# --- Author and links --- #
author:
  name: Agastya Seth
  twitter: agastya_seth

# Order here is the order shown in the footer. Keys must exist in _includes/icon.html.
social-network-links:
  email: "agastyaseth@pm.me"
  github: agastyaseth
  linkedin: agastyaseth
  twitter: agastya_seth
  soundcloud: agastyaseth
  spotify: agastyaseth
  rss: true

share-links-active:
  twitter: true
  linkedin: true

# --- Analytics (optional) --- #
#gtag: ""
#google_analytics: ""
#gtm: ""

# --- Build --- #
timezone: "America/Los_Angeles"
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/

kramdown:
  input: GFM

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      social-share: true
  -
    scope:
      path: ""
    values:
      layout: "page"

exclude:
  - CHANGELOG.md
  - CNAME
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - Vagrantfile
  - vendor

plugins:
  - jekyll-sitemap
