# Homepage "Selected work" list. `meta` is the short mono line; `url` is optional.
- title: "Agents that run chip-design flows"
  meta: "Synopsys · 2025 to now"
  text: "An orchestrator that dispatches task agents across 20 to 30 hour EDA runs, and an agent chat engine used by about 800 engineers a month."

- title: "Glucose estimation from wrist PPG"
  meta: "ASU ACME Lab · 2025"
  text: "A conditional VAE that rebuilds motion-corrupted PPG before CNN and Transformer models predict blood glucose. It cut MAE from 29.6 to 25.0 mg/dL and recovered about 2,000 unusable records."
  url: "/2025-05-10-non-invasive-glucose-estimation-from-wrist-ppg/"

- title: "Reward alignment for text-to-video"
  meta: "ASU · 2024"
  text: "Led bringing ReNO's reward-based noise optimization into Pyramid-Flow. It sharpens single-step image models but blurs hierarchical video ones, and the write-up explains why."
  url: "/2024-12-12-reward-alignment-for-text-to-video-models/"

- title: "LLMs for hardware security and test"
  meta: "ASU · ICCD 2025, DATE 2026"
  text: "Multi-agent LLMs that generate and detect synthetic hardware vulnerabilities, and a focus session on agentic test generation."

- title: "Evaluating LLM defenses"
  meta: "ASU · Findings of ACL 2024"
  text: "A systematic look at how LLM safety defenses trade off real protection against over-refusing harmless requests."
  url: "/2024-01-15-the-art-of-defending-a-systematic-evaluation-and-analysis-of-llm-defense-strategies-on-safety-and-over-defensiveness/"

- title: "Privacy-preserving ECG with RL"
  meta: "ASU ACME × UC Irvine · COINS 2025"
  text: "A PPO agent that transforms ECG data to resist re-identification linkage attacks while keeping it accurate enough for classification."
