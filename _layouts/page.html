---
layout: base
---

<div class="wrap wrap-narrow page">
  <header class="page-header">
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="page-subtitle">{{ page.subtitle }}</p>{% endif %}
  </header>
  <div class="{% unless page.plain %}prose{% endunless %}">
    {{ content }}
  </div>
</div>
