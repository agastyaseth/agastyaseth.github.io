<header class="site-nav">
  <div class="wrap nav-inner">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav aria-label="Main">
      <ul class="nav-links">
        {%- for link in site.navbar-links %}
        <li><a href="{{ link[1] | relative_url }}"{% if page.url == link[1] %} aria-current="page"{% endif %}>{{ link[0] }}</a></li>
        {%- endfor %}
        <li>
          <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
            <span class="when-light">{% include icon.html name="moon" %}</span>
            <span class="when-dark">{% include icon.html name="sun" %}</span>
          </button>
        </li>
      </ul>
    </nav>
  </div>
</header>
